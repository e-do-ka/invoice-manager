ja:
  date:
    formats:
      default: "%Y/%m/%d"
      long: "%Y年%m月%d日"
    abbr_day_names: [日, 月, 火, 水, 木, 金, 土]
    abbr_month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    day_names: [日曜日, 月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日]
    month_names: [~, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    order:
      - :year
      - :month
      - :day
  time:
    formats:
      default: "%Y/%m/%d %H:%M"
  errors:
    format: "%{attribute}%{message}"
    messages:
      blank: "を入力してください"
      invalid: "は不正な値です"
      taken: "はすでに使用されています"
      not_a_number: "は数値で入力してください"
      not_an_integer: "は整数で入力してください"
      greater_than: "は%{count}より大きい値にしてください"
      greater_than_or_equal_to: "は%{count}以上の値にしてください"
      less_than_or_equal_to: "は%{count}以下の値にしてください"
      required: "を選択してください"
  activerecord:
    errors:
      messages:
        record_invalid: "バリデーションに失敗しました: %{errors}"
        restrict_dependent_destroy:
          has_many: "%{record}が存在するため削除できません"
    models:
      client: 顧客
      invoice: 請求書
      invoice_item: 明細
      company_setting: 自社情報
    attributes:
      client:
        name: 顧客名
        contact_name: 担当者名
        email: メールアドレス
        postal_code: 郵便番号
        address: 住所
        notes: メモ
      invoice:
        client: 顧客
        client_id: 顧客
        invoice_number: 請求書番号
        issue_date: 発行日
        due_date: お支払期限
        status: ステータス
        tax_rate: 消費税率
        paid_on: 入金日
        notes: 備考
      invoice_item:
        description: 品目・内容
        quantity: 数量
        unit_price: 単価
      company_setting:
        name: 事業者名
        postal_code: 郵便番号
        address: 住所
        tel: 電話番号
        email: メールアドレス
        registration_number: 適格請求書発行事業者 登録番号
        bank_info: 振込先
